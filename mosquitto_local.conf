# =============================================================
# Mosquitto – Lokální broker pro běh s agent.py (BEZ bridge)
# =============================================================

# Povolit anonymní přístup pro lokální testování (odstraní chyby s hesly a ACL)
allow_anonymous true

# Frontování zpráv na lokálním brokeru
queue_qos0_messages true
max_queued_messages 1000

# 1. Standardní MQTT TCP listener (pro agent.py)
listener 1883
protocol mqtt

# 2. WebSocket listener (pro React klienta v prohlížeči)
listener 9999
protocol websockets
