# ===========================================================
# Mosquitto – lokální broker s agentem (bridge) na školní server
# ===========================================================

# ---- Globální autentizace ----
allow_anonymous false
password_file /opt/homebrew/etc/mosquitto/passwd
acl_file /opt/homebrew/etc/mosquitto/acl.conf

# ---- Frontování zpráv pro odpojené klienty ----
queue_qos0_messages true
max_queued_messages 1000

# ---- MQTT listener (pro lokální klienty přes TCP) ----
listener 1883

# ---- WebSocket listener (pro React klienta) ----
listener 9999
protocol websockets

# ===========================================================
# Bridge – agent, který udržuje spojení se školním brokerem
# ===========================================================
connection school
address pcfeib425t.vsb.cz:1883
remote_username server
remote_password Broker
topic /mschat/# both 1
cleansession false
notifications false
try_private true
restart_timeout 5 30
keepalive_interval 30
