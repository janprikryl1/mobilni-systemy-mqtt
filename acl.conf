# =============================================================
# ACL – Access Control List pro lokální Mosquitto broker
# =============================================================

# =============================================================
# 1. Pravidla pro autentizované klienty (pattern-based, %u = username)
# =============================================================

# --- Veřejný chat (/mschat/all/...) ---
# Čtení: Klient může číst všechny veřejné zprávy
pattern read /mschat/all/#
# Zápis: Klient může odesílat pouze pod svým jménem nebo anonymně
pattern write /mschat/all/%u
pattern write /mschat/all/anon

# --- Status uživatelů (/mschat/status/...) ---
# Čtení: Klient může číst stav (online/offline) všech uživatelů
pattern read /mschat/status/#
# Zápis: Klient může nastavovat pouze svůj vlastní stav (včetně LWT)
pattern write /mschat/status/%u

# --- Privátní zprávy (/mschat/user/...) ---
# Čtení: Klient může číst pouze privátní zprávy, kde je ON příjemcem (/mschat/user/<muj_login>/...)
pattern read /mschat/user/%u/#
# Zápis: Klient může odeslat privátní zprávu komukoliv (+), ale jako odesílatel v tématu musí být ON (%u)
pattern write /mschat/user/+/%u

# =============================================================
# 2. Agent (uživatel "server") – plný přístup pro bridge / proxy
# =============================================================
user server
topic readwrite #
