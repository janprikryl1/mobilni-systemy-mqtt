# =============================================================
# ACL – Access Control List pro lokální Mosquitto broker
# =============================================================

# Pattern-based pravidla – platí pro VŠECHNY autentizované uživatele.
# %u se nahradí uživatelským jménem přihlášeného klienta.

# Veřejný chat – každý může číst i psát
pattern readwrite /mschat/all/#

# Status (online/offline) – každý může číst i psát
pattern readwrite /mschat/status/#

# Privátní zprávy – uživatel vidí a zapisuje jen do svých témat
pattern readwrite /mschat/user/%u/#

# =============================================================
# Agent (uživatel "server") – plný přístup ke všem tématům
# =============================================================
user server
topic readwrite #
